# Configuración automática de despliegue en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirección SPA para que cualquier ruta cargue index.html sin dar error 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados recomendados de seguridad y optimización de assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
